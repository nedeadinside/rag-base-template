rag:
  prompts_path: prompts.yaml

  server:
    host: 0.0.0.0
    port: 8000

  queue:
    job_timeout: 21600
    concurrency: 4

  logging:
    level: INFO
    dir: logs

  ingest:
    max_upload_bytes: 52428800
    allowed_extensions: [".pdf"]
    spool_dir: spool

  docling:
    chunker: hybrid
    timeout_sec: null
    poll_interval_sec: 1.0
    poll_timeout_sec: 30
    result_timeout_sec: 120
    convert:
      do_ocr: false
      pdf_heading_hierarchy: true
      include_images: false
    chunking:
      max_tokens: # add here
      merge_peers: true

  embedder:
    model: # add here
    timeout_sec: 60
    batch_size: 32
    max_concurrency: 4
    query_prefix: # add here
    passage_prefix: # add here

  qdrant:
    timeout_sec: 30
    upsert_batch_size: 128
    dense_vector: # add here
    sparse_vector: # add here
    bm25:
      language: # add here
      tokenizer: # add here

  reranker:
    model: # add here
    timeout_sec: 60

  llm:
    model: # add here
    timeout_sec: # add here
    temperature: # add here
    max_tokens: # add here

  retrieve:
    top_k: 20
    top_n: 5
    prefetch_multiplier: 3
    verify: true

  webhook:
    timeout_sec: 15
