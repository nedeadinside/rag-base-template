rag:
  prompts_path: /app/prompts.yaml

  server:
    host: 0.0.0.0
    port: 8000

  queue:
    redis_url: redis://rag-redis:6379/0
    job_timeout: 21600
    concurrency: 4

  logging:
    level: INFO
    dir: /app/logs

  ingest:
    max_upload_bytes: 52428800
    allowed_extensions: [".pdf", ".docx", ".pptx", ".xlsx", ".html", ".md", ".txt"]
    spool_dir: /spool

  docling:
    url: http://docling:5001
    chunker: hybrid
    timeout_sec: null
    poll_interval_sec: 1.0
    poll_timeout_sec: 30
    result_timeout_sec: 120
    convert:
      do_ocr: false
      pdf_heading_hierarchy: true
      include_images: false
    chunking:
      max_tokens: 512
      merge_peers: true

  embedder:
    url: http://embedder:8000/v1
    model: intfloat/multilingual-e5-large
    timeout_sec: 60
    batch_size: 32
    max_concurrency: 4
    query_prefix: query
    passage_prefix: passage

  qdrant:
    url: http://qdrant:6333
    timeout_sec: 30
    upsert_batch_size: 128
    dense_vector: dense
    sparse_vector: bm25
    bm25:
      language: english
      tokenizer: multilingual

  reranker:
    url: http://reranker:8000/v1
    model: BAAI/bge-reranker-v2-m3
    timeout_sec: 60

  llm:
    url: http://llm:8000/v1
    model: Qwen/Qwen3-8B
    timeout_sec: 120
    temperature: 0.2
    max_tokens: 1024

  retrieve:
    top_k: 20
    top_n: 5
    prefetch_multiplier: 3
    verify: true

  webhook:
    timeout_sec: 15
