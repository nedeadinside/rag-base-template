[project]
name = "default-rag"
version = "0.1.0"
description = "Default RAG service"
authors = [
    {name = "nedeadinside",email = "aquvva67@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "arq>=0.26,<0.27",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
