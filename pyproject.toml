[project]
name = "default-rag"
version = "0.1.0"
description = "Default RAG service"
authors = [
    {name = "nedeadinside",email = "aquvva67@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "arq (>=0.26,<0.27)",
    "httpx (>=0.28,<0.29)",
    "pydantic (>=2.10,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "redis (>=5.3,<6.0)",
    "langchain-openai (>=0.3,<1.0)",
    "langchain-core (>=0.3,<1.0)",
    "openai (>=2.0,<3.0)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
api = [
    "fastapi (>=0.128,<0.129)",
    "uvicorn (>=0.40,<0.41)",
    "python-multipart (>=0.0.20,<0.1)",
]
dev = [
    "ruff (>=0.15.0,<0.16.0)",
]

[tool.poetry]
package-mode = false
